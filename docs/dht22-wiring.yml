layout:
  breadboard:
    hidden: false
board: freenove-esp32-wrover-ext
title: DHT22 temperature & humidity sensor
subtitle: Digital data pin on GPIO 27 — Freenove ESP32-WROVER
components:
  - type: module
    at: [3, c]
    pins: [VCC, DATA, GND]
    label_text: DHT22
    height: 120
wires:
  - {from: bb.3.c, to: board.L17, color: red, label: 3V3}
  - {from: bb.4.c, to: board.GPIO27, color: orange, label: data — GPIO 27}
  - {from: bb.5.c, to: board.L14, color: black, label: ground — GND}
notes:
  - "The 3-pin DHT22 module already has a pull-up resistor on DATA, so no extra resistor is needed."
  - "Bare 4-pin sensor instead? Pin 1 → 3V3, pin 2 → GPIO 27, pin 4 → GND (pin 3 unused), with a 4.7k–10k resistor from 3V3 to DATA."
  - "Power it from 3V3: the data line then swings at a safe level for the ESP32."
  - "GPIO 27 avoids this board's LED, button, buzzer and RGB pins; GPIO 32, 33 and 25 belong to the Simon Says buttons."
